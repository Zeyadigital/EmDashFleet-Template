# Builds this EmDash site for EmDash Fleet (app plan D7; Build and deploy,
# Workflow files in every site repository; tracker APA-170, OAU-088). It runs
# only when Fleet dispatches it, on the commit Fleet names, never on a push.
# It holds no secret and no Cloudflare credential: it bundles the Worker
# without uploading it (`wrangler versions upload --dry-run`) and keeps the
# bundle and the static output as an artifact for one day, which Fleet
# downloads and uploads to Cloudflare itself. The run uses this repository
# owner's GitHub Actions minutes. Keep the trigger, the inputs, the run-name
# and the artifact name as they are: Fleet relies on them
# (npm run check:workflows).
# https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflow_dispatch
# https://developers.cloudflare.com/workers/wrangler/commands/workers/#versions-upload
name: fleet-build
run-name: fleet-build ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: The EmDash Fleet job this build belongs to
        required: true
        type: string
      commit_sha:
        description: The full SHA of the commit to build
        required: true
        type: string

permissions:
  contents: read

concurrency: fleet-build

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check the inputs
        env:
          JOB_ID: ${{ inputs.job_id }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          [[ "$JOB_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "::error::job_id is not a job id"; exit 1; }
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::commit_sha is not a full commit SHA"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Node.js 26.13.0 bundles npm 11.20.0.
      - run: npm install --global npm@12.2.2
      - run: npm ci
      # Fails on an unsigned or unattested @emdash-fleet/* package and warns
      # for emdash and @emdash-cms/* (app plan, Template supply chain).
      - run: node scripts/audit-signatures.mjs
      - run: npm run build
      - run: npx wrangler versions upload --dry-run --outfile fleet-bundle/upload-form

      # Two paths, so the artifact's root is the repository: fleet-bundle/ and
      # dist/client/, with the hidden .assetsignore Fleet honours as Wrangler does.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fleet-bundle-${{ inputs.job_id }}
          path: |
            fleet-bundle/
            dist/client/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
